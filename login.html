<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELOBENZE VENTURES | SIGN IN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --gold-main: #d4af37;
            --gold-bright: #f9e282;
            --gold-gradient: linear-gradient(135deg, #b8860b, #ffd700, #d4af37, #aa771c);
            --text-light: #ffffff;
            --text-muted: #a5a5a5;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--gold-main);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .auth-card img { max-width: 90px; margin-bottom: 1rem; border-radius: 50%; }

        .auth-card h2 {
            font-family: var(--font-heading);
            color: var(--gold-bright);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.8rem; }

        .auth-form .input-group { margin-bottom: 1.2rem; position: relative; }

        .auth-form input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: var(--bg-main);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 6px;
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .auth-form input:focus {
            border-color: var(--gold-bright);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .auth-form .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-main);
        }

        .btn-gold {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 0.9rem;
            font-family: var(--font-body);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        #globalLoader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:100000}
        #globalLoader .loader{background:var(--bg-card);padding:16px 18px;border-radius:8px;display:flex;gap:12px;align-items:center;color:var(--text-light);border:1px solid rgba(212,175,55,0.12)}
        #globalLoader .spinner{width:26px;height:26px;border:4px solid rgba(255,255,255,0.12);border-top-color:var(--gold-bright);border-radius:50%;animation:spin .9s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loader-text{font-size:0.95rem}
    </style>

    <!-- Firebase client SDKs (compat). -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCpkKNfN-TUmDXsrZirXx0cmKVij37ayS4",
            authDomain: "elobenze-ventures.firebaseapp.com",
            projectId: "elobenze-ventures",
            storageBucket: "elobenze-ventures.firebasestorage.app",
            messagingSenderId: "52764302594",
            appId: "1:52764302594:web:f8cfcb21d9e740b676761b",
            measurementId: "G-9JKFVB1GW8"
        };

        if (!window.firebase || !firebase.apps?.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const fbAuth = firebase.auth();

        // Admin is decided by EMAIL only, not password. Firebase Auth already
        // verifies the password server-side before this code ever runs, so
        // there's nothing secret to protect here — change this to whichever
        // email should have admin access. This same constant must match the
        // one in admin.html.
        const ADMIN_EMAIL = 'elobenzeventures@gmail.com';
    </script>
</head>
<body>

    <div id="globalLoader" role="status" aria-live="polite">
        <div class="loader"><div class="spinner" aria-hidden="true"></div><div class="loader-text">Please wait...</div></div>
    </div>

    <div class="auth-card">
        <img src="/image/Elobenze kiddies.jpeg" alt="Elobenze Logo">
        <h2>CLIENT ACCESS</h2>
        <p>Sign in to unlock full store browsing & purchasing.</p>

        <div style="display:flex; gap:8px; justify-content:center; margin-bottom:12px;">
            <button id="btnSignIn" type="button" style="padding:6px 12px; border-radius:6px; background:transparent; border:1px solid rgba(212,175,55,0.25); color:var(--gold-bright);">Sign In</button>
            <button id="btnSignUp" type="button" style="padding:6px 12px; border-radius:6px; background:transparent; border:1px solid rgba(212,175,55,0.25); color:var(--text-muted);">Sign Up</button>
        </div>

        <form class="auth-form" id="loginForm" autocomplete="off" spellcheck="false">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="emailInput" name="email" autocomplete="email" placeholder="Email address" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="passwordInput" name="password" autocomplete="new-password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-gold" id="submitBtn">Sign In</button>
        </form>
    </div>

    <script>
        function showLoader(msg){ const el=document.getElementById('globalLoader'); if(el){ el.querySelector('.loader-text').innerText = msg||'Please wait...'; el.style.display='flex'; }}
        function hideLoader(){ const el=document.getElementById('globalLoader'); if(el) el.style.display='none'; }

        // No password comparison happens in JS at all — signInWithEmailAndPassword
        // / createUserWithEmailAndPassword above already did that server-side.
        // By the time we get here we just decide where a *verified* user goes.
        function routeAfterAuth(user) {
            localStorage.setItem('elobenze_user', user.email || '');
            if (user.email === ADMIN_EMAIL) {
                localStorage.setItem('elobenze_admin', 'true');
                window.location.href = 'admin.html';
            } else {
                localStorage.removeItem('elobenze_admin');
                window.location.href = 'index.html';
            }
        }

        // If Firebase already has a live session when this page loads,
        // skip straight to routing instead of asking them to sign in again.
        let handledInitialAuth = false;
        fbAuth.onAuthStateChanged(user => {
            if (user && !handledInitialAuth) {
                handledInitialAuth = true;
                routeAfterAuth(user);
            }
        });

        (function(){
            const btnSignIn = document.getElementById('btnSignIn');
            const btnSignUp = document.getElementById('btnSignUp');
            const submitBtn = document.getElementById('submitBtn');
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');

            let isSignUp = false;

            function setMode(signUp) {
                isSignUp = !!signUp;
                if (isSignUp) {
                    btnSignUp.style.color = 'var(--gold-bright)';
                    btnSignIn.style.color = 'var(--text-muted)';
                    submitBtn.textContent = 'Register';
                } else {
                    btnSignIn.style.color = 'var(--gold-bright)';
                    btnSignUp.style.color = 'var(--text-muted)';
                    submitBtn.textContent = 'Sign In';
                }
                try { emailInput.value = ''; passwordInput.value = ''; } catch (e) {}
                try { emailInput.focus(); } catch(e) {}
            }

            btnSignIn.addEventListener('click', () => setMode(false));
            btnSignUp.addEventListener('click', () => setMode(true));

            emailInput.value = '';
            passwordInput.value = '';
            setTimeout(() => { try { emailInput.value = ''; passwordInput.value = ''; } catch(e){} }, 300);

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = (emailInput.value || '').trim();
                const password = passwordInput.value.trim();

                if (!email) { emailInput.focus(); return alert('Please enter your email.'); }
                if (!password) { passwordInput.focus(); return alert('Please enter a password.'); }

                submitBtn.disabled = true;
                showLoader(isSignUp ? 'Creating account…' : 'Signing in…');
                try {
                    let cred;
                    if (isSignUp) {
                        cred = await fbAuth.createUserWithEmailAndPassword(email, password);
                    } else {
                        cred = await fbAuth.signInWithEmailAndPassword(email, password);
                    }
                    await routeAfterAuth(cred.user);
                } catch (err) {
                    console.error(err);
                    if (!isSignUp && err.code === 'auth/user-not-found') {
                        if (confirm('User not found. Would you like to register instead?')) {
                            setMode(true);
                        }
                    } else {
                        alert(err.message || 'Authentication error');
                    }
                } finally {
                    submitBtn.disabled = false;
                    hideLoader();
                }
            });

            setMode(false);
        })();
    </script>
</body>
</html>
